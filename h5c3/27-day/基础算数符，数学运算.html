<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      alert(5 % 2);
      alert(8 % 3);
      // ---
      alert(2 ** 2);
      alert(3 ** 2);
      alert(4 ** (1 / 2)); //4的平方根
      // ---
      /* 第一个操作数是一个字符串，
      所以编译器将其他两个操作数也视为了字符串。*/
      alert("1" + 2 + 2);
      /*在这里，运算符是按顺序工作。
      第一个 + 将两个数字相加，所以返回 4，
      然后下一个 + 将字符串 1 加入其中，
      所以就是 4 + '1' = '41'。*/
      alert(2 + 2 + "1");
      /*二元 + 是唯一一个以这种方式支持字符串的运算符。
      其他算术运算符只对数字起作用，
      并且总是将其运算元转换为数字。*/
    </script>
  </body>
</html>
