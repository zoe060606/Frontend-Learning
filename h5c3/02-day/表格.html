<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>表格</title>
  </head>
  <body>
    <table
      align="center"
      border="1"
      cellpadding="20"
      cellspacing="0"
      width="500"
      height="249"
    >
      <!--表格-->
      <tr>
        <!--行-->
        <th>姓名</th>
        <th>性别</th>
        <th>年龄</th>
      </tr>
      <tr>
        <td>阿水</td>
        <td>女</td>
        <td>28</td>
      </tr>
    </table>
  </body>
</html>
