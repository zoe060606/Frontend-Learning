<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>小说排行简单</title>
    <style>
      table {
        width: 500px;
        height: 249px;
      }
      table,
      td,
      th {
        border: 1px solid pink;
        border-collapse: collapse;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <table align="center" border="1" cellspacing="0">
      <thead>
        <tr>
          <th>排名</th>
          <th>关键词</th>
          <th>趋势</th>
          <th>今日搜索</th>
          <th>最近七日</th>
          <th>相关链接</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <td>1</td>
          <td>鬼吹灯</td>
          <td><img src="下降.png" /></td>
          <td>345</td>
          <td>123</td>
          <td>
            <a href="#" target="_blank">贴吧 </a
            ><a href="#" target="_blank">图片 </a
            ><a href="#" target="_blank">百科</a>
          </td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
