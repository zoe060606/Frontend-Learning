<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>显示隐藏元素</title>
    <style>
      .peppa {
        /* 隐藏对象 */
        display: none;
        /* 显示对象:display:block */
        width: 200px;
        height: 200px;
        background-color: pink;
      }
      .george {
        width: 200px;
        height: 200px;
        background-color: skyblue;
      }
    </style>
  </head>
  <body>
    <div class="peppa">佩奇</div>
    <div class="george">乔治</div>
  </body>
</html>
