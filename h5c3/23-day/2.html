<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .box {
        position: absolute;
        top: 0;
        left: 0;
        width: 200px;
        height: 200px;
      }
      .xiongda {
        background-color: red;
        z-index: 1;
      }
      .xionger {
        background-color: green;
        top: 50px;
        left: 50px;
        z-index: 2;
      }
      .guangtou {
        background-color: blue;
        left: 100px;
        top: 100px;
      }
    </style>
  </head>
  <body>
    <div class="box xiongda"></div>
    <div class="box xionger"></div>
    <div class="box guangtou"></div>
  </body>
</html>
