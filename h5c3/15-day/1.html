<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    * {
      margin: 0;
      padding: 0;
    }
    li {
      list-style: none;
    }
    .box {
      width: 248px;
      height: 163px;
      border: 1px solid #ccc;
      margin: 100px auto;
    }
    .box h3 {
      height: 32px;
      border-bottom: 1px dotted #ccc;
      font-size: 14px;
      font-weight: 400;
      line-height: 32px;
      padding-left: 15px;
    }
    .box ul li a {
      font-size: 12px;
      color: #666;
      text-decoration: none;
    }
    .box ul li a:hover {
      text-decoration: underline;
    }
    .box ul li {
      height: 23px;
      line-height: 23px;
      padding-left: 20px;
    }
    .box ul {
      margin-top: 7px;
    }
  </style>
  <body>
    <div class="box">
      <h3>快报</h3>
      <ul>
        <li><a href="#">[aa]</a></li>
        <li><a href="#">[bb]</a></li>
        <li><a href="#">[cc]</a></li>
        <li><a href="#">[dd]</a></li>
        <li><a href="#">[ee]</a></li>
      </ul>
    </div>
  </body>
</html>
