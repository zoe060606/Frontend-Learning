<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .yuanjiao {
        width: 300px;
        height: 150px;
        background-color: pink;
        border-radius: 10px;
      }
      .yuanxing {
        width: 200px;
        height: 200px;
        background-color: pink;
        border-radius: 100px;
      }
      .juxing {
        width: 300px;
        height: 100px;
        background-color: pink;
        border-radius: 50px;
      }
      .radius {
        width: 200px;
        height: 200px;
        border-radius: 10px 20px 30px 40px;
        background-color: pink;
      }
    </style>
  </head>
  <body>
    <div class="yuanjiao"></div>
    圆形
    <div class="yuanxing"></div>
    圆角矩形
    <div class="juxing"></div>
    四个角不一样的弧度
    <div class="radius"></div>
  </body>
</html>
