<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fuction</title>
  </head>
  <body>
    <script>
      //函数的主要目的之一：避免代码重复。
      function showMessage() {
        let message = "Hello world";
        alert(message);
      }
      showMessage();
      showMessage();
      // 局部变量---
      // alert(message); //局部变量无法在外部调用
      // 外部变量---
      let userName = "Amy";
      function showName() {
        let names = "Good job " + userName;
        alert(names);
      }
      showName();
      //如果在函数内部声明了同名变量，那么函数会遮蔽外部变量
      let userPassword = "123";
      function showPassword() {
        let userPassword = "456";
        let compeletPassword = "密码是:" + userPassword;
        alert(compeletPassword);
      }
      showPassword();
      alert(userPassword);
      // 参数---
      function showMessage2(from, text) {
        from = "*" + from + "*";
        alert(from + ":" + text);
      }
      let from = "Amy";
      showMessage2(from, "Hello");
      alert(from);
    </script>
  </body>
</html>
