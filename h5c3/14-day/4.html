<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      body {
        background-color: #f5f5f5;
      }
      a {
        color: #333;
        text-decoration: none;
      }
      .box {
        width: 249px;
        height: 415px;
        background-color: #fff;
        margin: 100px auto;
      }
      .box img {
        width: 100%;
      }
      .review {
        height: 60px;
        font-size: 14px;
        padding: 0 28px;
        margin-top: 15px;
      }
      .appraise {
        font-size: 12px;
        color: #b0b0b0;
        margin-top: 10px;
        padding: 0 28px;
      }
      .info {
        font-size: 14px;
        margin-top: 15px;
        padding: 0 28px;
      }
      .info h4 {
        display: inline-block;
        font-weight: 400;
      }
      .info span {
        color: orange;
      }
      .info em {
        font-style: normal;
        color: #ebe4e0;
        margin: 0 6px 0 15px;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <img src="images/小米.png" />
      <p class="review">小米焦点触控笔 Pro 白色</p>
      <div class="appraise">来自数据组的介绍</div>
      <div class="info">
        <h4><a href="#">产品介绍</a></h4>
        <em>|</em>
        <span>200</span>
      </div>
    </div>
  </body>
</html>
