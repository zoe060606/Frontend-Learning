<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .father {
        width: 400px;
        height: 400px;
        background-color: purple;
        margin-top: 50px;
        /* 防止父子塌陷 */
        /* border: 1px solid transparent;为父元素定义一个边框 */

      }
      .son {
        width: 200px;
        height: 200px;
        background-color: pink;
        margin-top: 100px;
      }

  <body>
    <div class="father">
      <div class="son"></div>
    </div>
  </body>
</html>
