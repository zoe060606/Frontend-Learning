<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- div + Tab -->
    <div></div>
    <div><span></span></div>
    <p></p>
    <!-- p*2:自动生成两个p标签 -->
    <p></p>
    <!-- ul>li:自动生成父类和子类的包含关系 -->
    <ul>
      <li></li>
    </ul>
    <div></div>
    <p></p>
    <!-- .nav自动生成class，默认div
      #gf 自动生成id
      需要p的类名:p.one-->
    <div class="nav"></div>
    <div id="gf"></div>
    <p class="one"></p>
    <!-- .demo$*5 -->
    <div class="demo1"></div>
    <div class="demo2"></div>
    <div class="demo3"></div>
    <div class="demo4"></div>
    <div class="demo5"></div>
    <!-- div{文字} -->
    <div>世界和平</div>
    <!-- div{$}*5 -->
    <div>1</div>
    <div>2</div>
    <div>3</div>
    <div>4</div>
    <div>5</div>
  </body>
</html>
