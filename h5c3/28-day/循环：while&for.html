<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>while&for</title>
  </head>
  <body>
    <script>
      // while单次循环
      let i = 3;
      while (i) {
        alert(i);
        i--;
      }
      // do...while
      let a = 0;
      do {
        alert(a);
        i++;
      } while (i < 3);
      //for(begin;condition;step){body;}
      for (let b = 0; b < 3; b++) {
        alert(b);
      }
    </script>
  </body>
</html>
