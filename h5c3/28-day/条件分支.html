<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>条件分支</title>
    <style></style>
  </head>
  <body>
    <script>
      let year = prompt("In which year", "");
      if (year == 2026) {
        alert("you are right");
        alert("you are smart");
      } else {
        alert("silly");
      }
      // ---
      let m = prompt("in which month", "");
      if (m < 6) {
        alert("ok");
        alert("maybe you are right");
      } else if (m < 13) {
        alert("oh my god");
        alert("the time is so quickly");
      } else {
        alert("are you joking?");
      }
      // ---
      let company = prompt("Which company created JavaScript?", "");
      company == "Netscape" ? alert("right") : alert("wrong");
    </script>
  </body>
</html>
